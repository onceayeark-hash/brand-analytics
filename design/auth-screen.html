<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAND ANALYTICS — サインイン</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-deepest: #050d1a;
    --navy-deep:    #0a1628;
    --navy-mid:     #0f2040;
    --navy-light:   #1a3a6e;
    --gold-bright:  #e8c96a;
    --gold-mid:     #c9a84c;
    --gold-muted:   #8a6d2f;
    --glass-bg:     rgba(255,255,255,0.04);
    --glass-border: rgba(232,201,106,0.15);
    --text-primary: #f0e8d0;
    --text-muted:   rgba(240,232,208,0.5);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--navy-deepest);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(26,58,110,0.5) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, rgba(15,32,64,0.8) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(232,201,106,0.03) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    opacity: 0.4;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 24px;
  }

  .logo {
    text-align: center;
    margin-bottom: 40px;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .logo-icon {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--gold-mid);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(232,201,106,0.06);
  }

  .logo-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--gold-bright);
  }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--gold-bright);
  }

  .logo-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 40px 36px;
    backdrop-filter: blur(20px);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    opacity: 0.6;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 300;
    color: var(--text-primary);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  .card-subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .field { margin-bottom: 20px; }

  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .field input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(232,201,106,0.12);
    border-radius: 8px;
    padding: 12px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  .field input::placeholder { color: rgba(240,232,208,0.25); }

  .field input:focus {
    border-color: rgba(232,201,106,0.4);
    background: rgba(255,255,255,0.06);
  }

  .btn-primary {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, rgba(232,201,106,0.15), rgba(201,168,76,0.1));
    border: 1px solid var(--gold-mid);
    border-radius: 8px;
    color: var(--gold-bright);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn-primary:hover {
    background: linear-gradient(135deg, rgba(232,201,106,0.22), rgba(201,168,76,0.16));
    box-shadow: 0 0 20px rgba(232,201,106,0.12);
    transform: translateY(-1px);
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(232,201,106,0.1);
  }

  .divider span {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .btn-ebay {
    width: 100%;
    padding: 13px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .btn-ebay:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.18);
    transform: translateY(-1px);
  }

  .ebay-badge {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.5px;
  }
  .e { color: #e53238; }
  .b { color: #0064d2; }
  .a { color: #f5af02; }
  .y { color: #86b817; }

  .card-footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  .card-footer a {
    color: var(--gold-muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .card-footer a:hover { color: var(--gold-bright); }

  .tier-hint {
    position: absolute;
    top: 20px;
    right: 20px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--gold-muted);
    text-transform: uppercase;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <img src="C:\Users\admin\OneDrive\Desktop\物販事業　一式\■会社関連\AI一式\claudcord一式\brand-analytics\assets\logo.png" alt="StayGold Japan" style="height:90px; width:auto; margin-bottom:12px; filter: drop-shadow(0 0 12px rgba(232,201,106,0.2));">
    <div class="logo-sub">eBay Seller Intelligence Platform</div>
  </div>

  <div class="card">
    <div class="tier-hint">free tier</div>

    <div class="card-title">サインイン</div>
    <div class="card-subtitle">アカウントにアクセスして、販売データの分析を始めましょう。</div>

    <div class="field">
      <label>メールアドレス</label>
      <input type="email" placeholder="your@email.com">
    </div>

    <div class="field">
      <label>パスワード</label>
      <input type="password" placeholder="••••••••">
    </div>

    <button class="btn-primary">サインイン</button>

    <div class="divider">
      <span>または eBay アカウントで続ける</span>
    </div>

    <button class="btn-ebay">
      <div class="ebay-badge">
        <span class="e">e</span><span class="b">b</span><span class="a">a</span><span class="y">y</span>
      </div>
      eBay アカウントで接続
    </button>

    <div class="card-footer">
      <p>アカウントをお持ちでない方は <a href="#">新規登録</a></p>
      <p style="margin-top:6px"><a href="#">パスワードを忘れた場合</a></p>
    </div>
  </div>
</div>

</body>
</html>
